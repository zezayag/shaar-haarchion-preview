<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>שער הארכיון · מאיפה הגענו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/fonts/colbo/colbo.css">
<style>
  /* מסך פתיחה למצגת: פריים אחד בגובה המסך, אריחי בנטו עם החומרים שהסקיצה נבנתה מהם; הכפתור באמצע */
  :root {
    --blue: #11769C; --ink: #1F134A; --paper: #F4F2EC; --sand: #DED6C4; --sky: #B3E0EB; --gold: #EBAD29; --white: #FFFFFF;
    --ink-soft: rgba(31, 19, 74, .78);
    --display: "COLBO", "Heebo", sans-serif; --text: "Heebo", system-ui, sans-serif;
    --gap: 8px; --pad: 16px; --r: 16px;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sand); color: var(--ink); font-family: var(--text); }
  html, body { height: 100%; overflow: hidden; } /* אורי: עמוד ללא גלילה — בכל מכשיר */
  img { display: block; max-width: 100%; }
  ::selection { background: var(--sky); color: var(--ink); }

  .bento {
    height: 100svh; padding: var(--pad); display: grid; gap: var(--gap);
    grid-template-columns: 1.1fr 1fr 1.4fr 1fr .85fr;
    grid-template-rows: 1fr 1.05fr 1fr;
    grid-template-areas:
      "logo  logo  book  book  wf"
      "pal   type  cta   photo wf"
      "pal   type  sg    photo wf";
  }
  .tile { position: relative; overflow: hidden; border-radius: var(--r); background: var(--paper); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tile__media { flex: 1; min-height: 0; overflow: hidden; }
  .tile__media img { width: 100%; height: 100%; object-fit: cover; }
  .tile__cap { padding: 12px 16px 14px; font-size: 16px; line-height: 1.4; color: var(--ink); }
  .tile__cap b { font-weight: 500; }

  /* לוגו + משפט פתיחה */
  .t-logo { grid-area: logo; background: var(--white); padding: clamp(20px, 3vw, 40px); justify-content: center; align-items: center; } /* אורי 26.10: בלי שורת ההסבר — הלוגו לבד, ממורכז */
  .t-logo img { flex: 1 1 auto; min-height: 0; width: 100%; max-width: 520px; object-fit: contain; object-position: center; }
  .t-logo p { margin: 16px 0 0; font-family: var(--display); font-size: clamp(20px, 1.7vw, 28px); line-height: 1.25; max-width: 22em; }

  /* ספר המותג */
  .t-book { grid-area: book; }
  .t-book .tile__media img { object-position: center 28%; }

  /* השלד — נגלל לאט בתוך האריח */
  .t-wf { grid-area: wf; background: #F7F7F6; }
  .t-wf .tile__media img { height: auto; object-fit: initial; }

  /* פלטה */
  .t-pal { grid-area: pal; }
  .swatches { flex: 1; display: grid; grid-template-rows: 1.6fr 1.2fr 1fr 1fr 1fr 1fr; min-height: 0; }
  .sw { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding: 8px 16px; font-size: 16px; min-height: 0; }
  .sw span:last-child { font-variant-numeric: tabular-nums; direction: ltr; }
  .sw--ink { background: var(--ink); color: var(--paper); }
  .sw--blue { background: var(--blue); color: var(--white); }
  .sw--sky { background: var(--sky); color: var(--ink); }
  .sw--gold { background: var(--gold); color: var(--ink); }
  .sw--sand { background: var(--sand); color: var(--ink); }
  .sw--paper { background: var(--paper); color: var(--ink); }
  /* אורי 26.10: מעבר עכבר על צבע — הפס שלו מתרחב קצת בגובה, באותו מבנה */
  .swatches { transition: grid-template-rows 320ms var(--ease); }
  .swatches:has(.sw--ink:hover) { grid-template-rows: 2.05fr 1.2fr 1fr 1fr 1fr 1fr; }
  .swatches:has(.sw--blue:hover) { grid-template-rows: 1.6fr 1.65fr 1fr 1fr 1fr 1fr; }
  .swatches:has(.sw--sky:hover) { grid-template-rows: 1.6fr 1.2fr 1.45fr 1fr 1fr 1fr; }
  .swatches:has(.sw--gold:hover) { grid-template-rows: 1.6fr 1.2fr 1fr 1.45fr 1fr 1fr; }
  .swatches:has(.sw--sand:hover) { grid-template-rows: 1.6fr 1.2fr 1fr 1fr 1.45fr 1fr; }
  .swatches:has(.sw--paper:hover) { grid-template-rows: 1.6fr 1.2fr 1fr 1fr 1fr 1.45fr; }
  @media (prefers-reduced-motion: reduce) { .swatches { transition: none; } }

  /* טיפוגרפיה */
  .t-type { grid-area: type; background: var(--white); padding: clamp(16px, 2vw, 28px); justify-content: space-between; }
  .type-big { font-family: var(--display); font-weight: 300; font-size: clamp(56px, min(8vw, 17svh), 150px); line-height: .85; letter-spacing: -0.03em; color: var(--blue); margin: 0; }
  .type-head { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 2.1vw, 36px); line-height: 1.05; margin: 12px 0 0; }
  .type-body { font-size: 16px; line-height: 1.5; margin: 12px 0 0; }
  .type-names { margin: 16px 0 0; font-size: 16px; line-height: 1.5; color: var(--ink-soft); }
  .type-names b { color: var(--ink); font-weight: 500; }

  /* הכפתור באמצע */
  .t-cta { grid-area: cta; background: var(--ink); align-items: center; justify-content: center; padding: 24px; }
  .cta {
    display: inline-flex; align-items: center; gap: 12px; min-height: 72px; padding: 0 clamp(20px, 2.2vw, 36px) 0 clamp(16px, 1.8vw, 28px); border-radius: 999px; white-space: nowrap;
    background: var(--gold); color: var(--ink); font-family: var(--display); font-size: clamp(22px, 1.9vw, 30px); font-weight: 700; text-decoration: none;
    transition: transform 280ms var(--ease), background-color 200ms ease;
  }
  .cta svg { width: 24px; height: 24px; flex: none; transition: transform 280ms var(--ease); }
  .cta:hover { background: #F2BE4A; transform: translateY(-2px); }
  .cta:hover svg { transform: translateX(-4px); }
  .cta:active { transform: translateY(0) scale(.98); }
  .cta:focus-visible { outline: 3px solid var(--sky); outline-offset: 4px; }
  /* שלושה קישורים לסקיצות */
  .t-cta { flex-direction: column; gap: 16px; }
  .cta-h { margin: 0; color: var(--sky); font-family: var(--display); font-weight: 700; font-size: clamp(18px, 1.5vw, 24px); line-height: 1.2; }
  .cta-row { display: flex; gap: clamp(20px, 2vw, 28px); }
  .cta--n { justify-content: center; width: clamp(64px, 5.4vw, 88px); height: clamp(64px, 5.4vw, 88px); min-height: 0; padding: 0; font-size: clamp(30px, 2.6vw, 42px); line-height: 1; }
  /* מעבר עכבר על מספר: הקופסה מקבלת את הפתיחה של אותה סקיצה (צבע, תמונה, טיפוגרפיה) */
  .t-cta { position: relative; isolation: isolate; transition: background-color 300ms ease; }
  .cta-bg { position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity 320ms ease; pointer-events: none; }
  .cta-bg--1 { background: linear-gradient(rgba(133, 128, 118, .9), rgba(133, 128, 118, 0) 120px), linear-gradient(#B9B3A4, #B9B3A4), url("1st/assets/img/hero/ruhama-1944-3.jpg") center 40% / cover; background-blend-mode: multiply, multiply, normal; }
  .cta-bg--2 { background: var(--white); }
  .cta-bg--2::before { content: ""; position: absolute; inset: 0; background: url("2nd/assets/img/arch/nahaloz-1953-1-640.jpg") center 40% / cover; opacity: .13; /* אורי 26.10: תמונה מורגשת יותר */ }
  .cta-h { position: relative; transition: color 300ms ease; }
  .t-cta:has([data-s="1"]:is(:hover, :focus-visible)) .cta-bg--1,
  .t-cta:has([data-s="2"]:is(:hover, :focus-visible)) .cta-bg--2 { opacity: 1; }
  /* 1: צילום ספיה, קולבו רגיל בלבן */
  .t-cta:has([data-s="1"]:is(:hover, :focus-visible)) .cta-h { color: var(--white); font-weight: 400; }
  /* 2: לבן עם צילום ב-7%, קולבו דק בכחול */
  .t-cta:has([data-s="2"]:is(:hover, :focus-visible)) .cta-h { color: var(--blue); font-weight: 300; }
  /* 3: כחול כהה בלי תמונה, קולבו שחור-עבה בלבן עם נקודה צהובה, ועיגול קטן שמסתובב סביב המספר */
  .t-cta:has([data-s="3"]:is(:hover, :focus-visible)) .cta-h { color: var(--white); font-weight: 900; }
  .t-cta:has([data-s="3"]:is(:hover, :focus-visible)) .cta-h::after { content: ""; display: inline-block; width: .3em; height: .3em; margin-inline-start: .08em; border-radius: 50%; background: var(--gold); }
  .cta--n { position: relative; }
  .cta-orbit { position: absolute; inset: -10px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .22); opacity: 0; transition: opacity 260ms ease; pointer-events: none; }
  .cta-orbit span { position: absolute; left: 50%; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--gold); }
  .cta--n[data-s="3"]:is(:hover, :focus-visible) .cta-orbit { opacity: 1; animation: cta-orbit 4s linear infinite; }
  .cta--n[data-s="3"]:hover { transform: none; }
  @keyframes cta-orbit { to { transform: rotate(360deg); } }
  /* אורי 26.10: גם המספר עצמו מקבל את הכפתור של הסקיצה (3 נשאר כמו שהוא) */
  .cta--n { transition: transform 280ms var(--ease), background-color 200ms ease, color 200ms ease, box-shadow 200ms ease; }
  .cta--n[data-s="1"]:is(:hover, :focus-visible) { background: var(--blue); color: var(--white); font-weight: 400; transform: none; }
  .cta--n[data-s="2"]:is(:hover, :focus-visible) { background: var(--blue); color: var(--white); font-family: "Heebo", system-ui, sans-serif; font-weight: 500; transform: none;
    box-shadow: 0 1px 2px rgba(31, 19, 74, .16), 0 1px 3px 1px rgba(31, 19, 74, .08); }
  @media (prefers-reduced-motion: reduce) { .cta--n[data-s="3"]:is(:hover, :focus-visible) .cta-orbit { animation: none; } .cta-bg, .cta-h, .t-cta { transition: none; } }

  /* תצלומי ארכיון — מתחלפים */
  .t-photo { grid-area: photo; }
  .stack { position: relative; }
  .stack img { position: absolute; inset: 0; opacity: 0; transition: opacity 1200ms ease; }
  .stack img.is-on { opacity: 1; }

  /* הסטייל גייד */
  .t-sg { grid-area: sg; }
  .t-sg .tile__media img { object-position: center top; }

  /* מסך נמוך (מחשב נייד קטן): בלי שורת ההסבר באריח הטיפוגרפיה */
  @media (min-width: 1024px) and (max-height: 700px) { .type-body { display: none; } .t-logo { padding: 20px 24px; } .t-logo p { font-size: 20px; margin-top: 8px; } }

  /* אורי: לחיצה על עמוד 62 או על השלד פותחת את התמונה בגדול (dialog: Esc, לחיצה על הרקע או X סוגרים) */
  .zoom { all: unset; display: block; flex: 1; min-height: 0; overflow: hidden; cursor: zoom-in; }
  .zoom:focus-visible { outline: 3px solid var(--blue); outline-offset: -3px; }
  .zoom img { width: 100%; height: 100%; object-fit: cover; transition: transform 400ms var(--ease); }
  .t-book .zoom:hover img { transform: scale(1.02); }
  .t-wf .zoom img { height: auto; object-fit: initial; }
  .zoom.stack { position: relative; } /* אורי 26.10: גם התצלומים והסטייל גייד נפתחים בגדול */
  .t-sg .zoom img { object-position: center top; }
  .t-photo .zoom:hover img.is-on, .t-sg .zoom:hover img { transform: scale(1.02); }
  .lb { width: 100vw; height: 100svh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--paper); overflow: hidden; }
  .lb::backdrop { background: rgba(31, 19, 74, .92); }
  .lb[open] { display: grid; place-items: center; animation: lb-in 220ms var(--ease); }
  @keyframes lb-in { from { opacity: 0; transform: scale(.98); } }
  .lb__fig { margin: 0; max-width: 92vw; max-height: 100svh; }
  .lb__fig img { display: block; max-width: 92vw; max-height: 88svh; width: auto; height: auto; border-radius: 8px; }
  .lb--tall .lb__fig { height: 100svh; overflow-y: auto; padding: 48px 0; scrollbar-width: thin; }
  .lb--tall .lb__fig img { max-height: none; width: min(1100px, 84vw); }
  .lb__close { position: fixed; top: 16px; left: 16px; width: 48px; height: 48px; border: 0; border-radius: 50%; background: var(--paper); color: var(--ink); display: grid; place-items: center; cursor: pointer; transition: background-color 200ms ease; }
  .lb__close:hover { background: var(--white); }
  .lb__close:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  .lb__close svg { width: 24px; height: 24px; }
  @media (prefers-reduced-motion: reduce) { .lb[open] { animation: none; } .zoom img { transition: none; } }

  /* כניסה: האריחים עולים בזה אחר זה; בלי סקריפט הכל גלוי */
  .js .tile { opacity: 0; transform: translateY(20px); }
  .js .tile.is-in { opacity: 1; transform: none; transition: opacity 700ms var(--ease), transform 900ms var(--ease); }
  .t-wf .zoom img { animation: pan 60s ease-in-out 1.2s infinite alternate; }
  @keyframes pan { to { transform: translateY(calc(-100% + var(--wf-h, 600px))); } }

  @media (prefers-reduced-motion: reduce) {
    .js .tile { opacity: 1; transform: none; }
    .js .tile.is-in { transition: none; }
    .t-wf .zoom img { animation: none; }
    .stack img { transition: none; }
    .cta, .cta svg { transition: none; }
  }

  /* טאבלט וטלפון: גם כאן בלי גלילה — שתי עמודות, הכפתור מתחת לספר המותג, הכיתובים קצרים */
  @media (max-width: 1023px) {
    :root { --pad: 12px; --r: 12px; }
    .bento { grid-template-columns: 1fr 1fr; grid-template-rows: .75fr 1.1fr .55fr 1fr 1fr 1fr;
      grid-template-areas: "logo logo" "book book" "cta cta" "pal type" "photo wf" "sg wf"; }
    .t-logo { padding: 16px; flex-direction: row; align-items: center; gap: 16px; }
    .t-logo img { width: 52%; }
    .t-logo p { margin: 0; font-size: clamp(16px, 2.6vw, 22px); }
    .tile__cap { padding: 8px 12px 10px; font-size: 15px; }
    .type-big { font-size: clamp(48px, 9vw, 96px); }
    .type-head { font-size: clamp(18px, 3.2vw, 28px); margin-top: 8px; }
    .type-body { display: none; }
    .type-names { margin-top: 8px; font-size: 15px; }
    .swatches { grid-template-rows: none; grid-template-columns: repeat(6, 1fr); }
    .sw { padding: 8px 6px; font-size: 15px; justify-content: center; }
    .sw span:last-child { display: none; }
  }
  @media (max-width: 599px) {
    .bento { grid-template-rows: .7fr 1fr .5fr 1.15fr 1fr 1fr; }
    .t-logo { flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; }
    .t-logo img { width: 78%; }
    .t-logo p { font-size: 16px; }
    .cta { min-height: 56px; font-size: 22px; padding: 0 28px 0 22px; }
    .cta--n { width: 56px; height: 56px; padding: 0; font-size: 26px; }
    .sw span:last-child { display: none; }
    .type-names { display: none; }
    .tile__cap .more { display: none; }
    .sw span { display: none; }
  }
</style>
</head>
<body>
<main class="bento">
  <section class="tile t-logo" aria-label="שער הארכיון">
    <img src="img/logo-paper.png" width="1306" height="428" alt="שער הארכיון · מועצה אזורית שער הנגב">
  </section>

  <figure class="tile t-book" style="margin:0">
    <button type="button" class="tile__media zoom" data-zoom="img/page62.jpg" aria-label="הגדלה: עמוד 62 בספר המותג"><img src="img/page62.jpg" width="1600" height="900" alt="עמוד 62 בספר המותג: הירו עם הלוגו, שורת הסיפור ופס 12 הקהילות"></button>
    <figcaption class="tile__cap"><b>ספר המותג</b><span class="more">, עמ׳ 62: ההנחיה להירו</span></figcaption>
  </figure>

  <figure class="tile t-wf" style="margin:0">
    <button type="button" class="tile__media zoom" data-zoom="img/wireframe.jpg" data-tall aria-label="הגדלה: השלד של עמוד הבית"><img src="img/wireframe.jpg" width="1440" height="4960" alt="השלד של עמוד הבית, מההירו ועד הפוטר"></button>
    <figcaption class="tile__cap"><b>מבנה עמוד הבית</b></figcaption>
  </figure>

  <section class="tile t-pal" aria-label="פלטת הצבעים">
    <div class="swatches">
      <div class="sw sw--ink"><span>דיו</span><span>#1F134A</span></div>
      <div class="sw sw--blue"><span>כחול</span><span>#11769C</span></div>
      <div class="sw sw--sky"><span>שמיים</span><span>#B3E0EB</span></div>
      <div class="sw sw--gold"><span>זהב</span><span>#EBAD29</span></div>
      <div class="sw sw--sand"><span>חול</span><span>#DED6C4</span></div>
      <div class="sw sw--paper"><span>נייר</span><span>#F4F2EC</span></div>
    </div>
    <p class="tile__cap" style="margin:0;background:var(--white)"><b>פלטת הצבעים</b><span class="more"> מספר המותג</span></p>
  </section>

  <section class="tile t-type" aria-label="טיפוגרפיה">
    <div>
      <p class="type-big" aria-hidden="true">1941</p>
      <p class="type-head">הסיפור של הקהילות</p>
      <p class="type-body">שהקימו כאן בית. כל פריט בארכיון מסודר לפי יישוב ולפי שנה.</p>
    </div>
    <p class="type-names"><b>COLBO Extended</b> לכותרות ולשנים · <b>Heebo</b> לטקסט רץ</p>
  </section>

  <section class="tile t-cta" aria-labelledby="cta-h">
    <!-- אורי 26.10: שלוש הסקיצות הסופיות (1st · 2nd · 3rd) -->
    <span class="cta-bg cta-bg--1" aria-hidden="true"></span>
    <span class="cta-bg cta-bg--2" aria-hidden="true"></span>
    <p class="cta-h" id="cta-h">צפייה בסקיצות</p>
    <nav class="cta-row" aria-labelledby="cta-h">
      <a class="cta cta--n" data-s="1" href="1st/index.html" target="_blank" rel="noopener" aria-label="סקיצה 1, נפתחת בלשונית חדשה">1</a>
      <a class="cta cta--n" data-s="2" href="2nd/index.html" target="_blank" rel="noopener" aria-label="סקיצה 2, נפתחת בלשונית חדשה">2</a>
      <a class="cta cta--n" data-s="3" href="3rd/index.html" target="_blank" rel="noopener" aria-label="סקיצה 3, נפתחת בלשונית חדשה">3<span class="cta-orbit" aria-hidden="true"><span></span></span></a>
    </nav>
  </section>

  <figure class="tile t-photo" style="margin:0">
    <button type="button" class="tile__media stack zoom" aria-label="הגדלה: תצלום הארכיון המוצג">
      <!-- אורי 26.10: רק התצלום עם הסוס (כמו ברקע של 2) -->
      <img class="is-on" src="img/nahaloz-1953-1.jpg" alt="תצלום ארכיון: עגלה רתומה לסוס ומגדל שמירה, נחל עוז">
    </button>
    <figcaption class="tile__cap"><b>תצלומי ארכיון בלבד</b></figcaption>
  </figure>

  <figure class="tile t-sg" style="margin:0">
    <button type="button" class="tile__media zoom" data-zoom="img/styleguide.jpg" aria-label="הגדלה: הסטייל גייד"><img src="img/styleguide.jpg" width="1400" height="1750" alt="הסטייל גייד: הלוגו, הצבע הראשי והגופן"></button>
    <figcaption class="tile__cap"><b>הסטייל גייד</b><span class="more"> על בסיס ספר המותג</span></figcaption>
  </figure>
</main>
<dialog class="lb" id="lb" aria-label="תצוגה מקדימה">
  <figure class="lb__fig"><img id="lbImg" alt=""></figure>
  <button type="button" class="lb__close" id="lbClose" aria-label="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</dialog>
<script>
  (function () {
    var root = document.documentElement; root.classList.add('js');
    var tiles = [].slice.call(document.querySelectorAll('.tile'));
    // סדר הכניסה: מהלוגו, דרך הכפתור, אל השאר
    var order = ['t-logo', 't-cta', 't-book', 't-type', 't-pal', 't-photo', 't-sg', 't-wf'];
    tiles.sort(function (a, b) { return order.indexOf(a.classList[1]) - order.indexOf(b.classList[1]); });
    requestAnimationFrame(function () { tiles.forEach(function (t, i) { setTimeout(function () { t.classList.add('is-in'); }, 80 + i * 80); }); });
    // תצוגה מקדימה בגדול: עמוד 62 בגובה המסך, השלד ברוחב קריא עם גלילה בתוך החלון
    var lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg');
    [].forEach.call(document.querySelectorAll('.zoom'), function (z) {
      z.addEventListener('click', function () {
        var cur = z.querySelector('img.is-on') || z.querySelector('img'); // בתצלומים המתחלפים: התצלום שמוצג עכשיו
        lbImg.src = z.dataset.zoom || cur.getAttribute('src'); lbImg.alt = cur.alt || 'תצלום ארכיון';
        lb.classList.toggle('lb--tall', z.hasAttribute('data-tall'));
        lb.showModal();
        lb.querySelector('.lb__fig').scrollTop = 0; // השלד נפתח מההירו
        document.getElementById('lbClose').focus({ preventScroll: true });
      });
    });
    document.getElementById('lbClose').addEventListener('click', function () { lb.close(); });
    lb.addEventListener('click', function (e) { if (e.target === lb || e.target.classList.contains('lb__fig')) lb.close(); });
    // השלד נגלל עד הסוף ובחזרה, לפי גובה האריח
    var wf = document.querySelector('.t-wf .zoom');
    function size() { wf.style.setProperty('--wf-h', wf.clientHeight + 'px'); }
    addEventListener('resize', size); size();
    // התצלומים מתחלפים כל 4 שניות (לא בתנועה מופחתת)
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var imgs = document.querySelectorAll('.stack img'), n = 0;
    setInterval(function () { imgs[n].classList.remove('is-on'); n = (n + 1) % imgs.length; imgs[n].classList.add('is-on'); }, 4000);
  })();
</script>
</body>
</html>
